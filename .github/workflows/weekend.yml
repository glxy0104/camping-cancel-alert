name: camping-weekend

# 광교·율동·무봉산·궁평 빈자리 감시 (weekend/ 폴더, 설정은 weekend/config.yaml)
# 잡 하나가 약 5시간 40분 동안 10분 간격으로 조회하고, 30분마다 다음 잡을 대기열에 올려 끊김 없이 이어간다.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camping-weekend
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: weekend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 감시 루프 (10분 간격, 약 5시간 40분)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            python monitor.py || true
            git config user.name "camping-monitor-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/state.json
            git commit -qm "weekend 상태 업데이트" || true
            git pull -q --rebase -X theirs || true
            git push -q || true
            sleep $(( 600 - ($(date +%s) - start) > 0 ? 600 - ($(date +%s) - start) : 0 ))
          done

name: camping-monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 시동 시도 (실행 중이면 대기열에서 기다림)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: camping-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 감시 루프 실행 (약 5시간 45분)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --loop 345

      - name: 상태 저장 (마무리)
        if: always()
        run: |
          git config user.name "camping-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git commit -m "상태 업데이트" || true
          git pull --rebase || true
          git push || true
